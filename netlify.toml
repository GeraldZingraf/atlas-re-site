# Netlify config for agent-atlas.co
#
# The Atlas for Real Estate product was wound down on 2026-08-28 and its whole
# surface (landing page, pre-sell bridge, legal pages, analytics, and the 22
# serverless functions behind the kit-era PayPal pipeline and the SaaS lead
# capture) was removed. What remains is a static placeholder while the domain is
# repurposed for the next project. See WIND-DOWN.md.

[build]
  publish = "."

# Working docs live in the repo for the record but must not be served, since
# publish = "." would otherwise expose them as static files.
[[redirects]]
  from = "/WIND-DOWN.md"
  to = "/index.html"
  status = 404
  force = true

# Everything the old site published is gone. Answer the retired paths with a
# clean 410 (permanently gone) rather than a soft 404, so search engines and any
# lingering links drop them quickly.
[[redirects]]
  from = "/start"
  to = "/index.html"
  status = 410
  force = true
[[redirects]]
  from = "/legal/*"
  to = "/index.html"
  status = 410
  force = true
[[redirects]]
  from = "/go/*"
  to = "/index.html"
  status = 410
  force = true
[[redirects]]
  from = "/.netlify/functions/*"
  to = "/index.html"
  status = 410
  force = true

# ---------------------------------------------------------------------------
# One-page site (added 2026-10-28). Everything above this line is unchanged.
# ---------------------------------------------------------------------------

# Fonts never change under the same name, so let browsers keep them.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images, CSS and JS: cache for a day, then check for a newer copy.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Basic hardening. The page loads nothing from other sites, so the content
# security policy only allows this site's own files.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
