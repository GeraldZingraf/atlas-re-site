<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Atlas</title>
<meta name="description" content="Agent Atlas is building something new.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png">
<style>
  :root {
    --bg: #0f1219;
    --panel: #171b27;
    --ink: #eef1f7;
    --ink-soft: #a6adbd;
    --rule: #2a3040;
    --accent: #7c5cff;
    --accent-2: #2bb6b0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    display: grid;
    place-items: center;
    padding: 32px;
  }
  main {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 44px 40px;
    text-align: center;
  }
  .mark {
    width: 46px;
    height: 46px;
    margin: 0 auto 26px;
    border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  h1 {
    margin: 0 0 14px;
    font-size: clamp(1.7rem, 5vw, 2.15rem);
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  p { margin: 0 auto; max-width: 44ch; color: var(--ink-soft); }
  p + p { margin-top: 14px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6fa;
      --panel: #ffffff;
      --ink: #171b27;
      --ink-soft: #5b6474;
      --rule: #dfe4ec;
    }
  }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>Agent Atlas</h1>
    <p>We are building something new. This page is a placeholder while the next project takes shape.</p>
  </main>
</body>
</html>
